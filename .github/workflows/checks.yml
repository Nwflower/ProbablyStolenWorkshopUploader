name: checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  offline-checks:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.1
          components: rustfmt, clippy

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Rust format
        run: cargo fmt --all -- --check

      - name: Rust tests
        run: cargo test -p uploader-core --locked

      - name: Rust lint
        run: cargo clippy -p uploader-core --all-targets -- -D warnings

      - name: Install frontend dependencies
        run: npm ci

      - name: Frontend build
        run: npm run build

      - name: Frontend tests
        run: npm test

      - name: Desktop shell compiles
        run: cargo check -p workshop-uploader --locked
