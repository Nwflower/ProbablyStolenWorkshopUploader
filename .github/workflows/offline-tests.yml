name: Offline tests
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Test publishing logic with FakeSteam
        run: dotnet run --project tests/WorkshopUploaderTests/WorkshopUploaderTests.csproj --configuration Release
